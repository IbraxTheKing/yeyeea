<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Boutique - Yeya Informatique</title>

    <link rel="stylesheet" href="../css/style.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Archivo+Black&family=Asset&family=BBH+Bartle&display=swap');
    </style>
</head>

<body>

<header>
    <h2>Yeya Informatique</h2>

    <div class="nav-center">
        <div class="search-box" id="searchBox">
            <input
                    type="text"
                    id="searchInput"
                    placeholder="Rechercher un produit..."
                    autocomplete="off"
            >

            <!-- dropdown complet caché par défaut -->
            <div id="searchPanel" class="search-panel">

                <div class="search-filters">
                    <select id="filterCategory">
                        <option value="all">Toutes catégories</option>
                    </select>

                    <select id="filterPrice">
                        <option value="all">Prix</option>
                        <option value="0-50">0 - 50 <span>&#8364;</span></option>
                        <option value="50-200">50 - 200 <span>&#8364;</span></option>
                        <option value="200-500">200 - 500 <span>&#8364;</span></option>
                        <option value="500+">500 <span>&#8364;</span> +</option>
                    </select>
                </div>

                <div id="searchResults" class="search-results"></div>

            </div>
        </div>
    </div>

    <div class="nav-right">
        <a href="../index.html">Accueil</a>
        <a href="index.html">Boutique</a>
        <a href="cart.html">Panier</a>
        <a href="../about.html">À propos</a>
    </div>
</header>


<main class="container">

    <div class="shop-layout">

        <!-- SIDEBAR -->
        <aside class="sidebar">

            <h3>Catégories</h3>

            <ul id="categoryList">
                <li onclick="filterCategory('all')" class="active">Toutes</li>
            </ul>

            <hr>

            <h3>Prix maximum</h3>

            <div class="price-slider">
                <input type="range" id="priceRange" min="0" max="5000" value="2000">
                <div class="price-values">
                    <span>0<span>&#8364;</span></span>
                    <span id="priceMax">5000<span>&#8364;</span></span>
                </div>
            </div>

            <hr>

            <button class="secondary reset-btn" onclick="resetFilters()">Réinitialiser</button>

        </aside>

        <!-- CONTENT -->
        <div class="shop-content">

            <section class="shop-hero">
                <h1 class="title-font">Notre boutique</h1>
                <p>Matériel informatique sélectionné, testé et adapté à vos besoins.</p>
            </section>

            <!-- FILTERS -->
            <div class="filter-bar">

                <select id="categoryFilter" onchange="onDropdownCategoryChange()">
                    <option value="all">Toutes les catégories</option>
                </select>

                <select id="sortFilter">
                    <option value="default">Trier par défaut</option>
                    <option value="price-asc">Prix croissant</option>
                    <option value="price-desc">Prix décroissant</option>
                    <option value="name-asc">Nom (A-Z)</option>
                </select>

                <span id="resultsCount" class="results-count"></span>

            </div>

            <!-- PRODUCTS -->
            <div id="products"></div>

        </div>
    </div>

</main>

<!-- JS -->
<script src="../js/api.js"></script>
<script src="../js/search.js"></script>
<script src="../js/cart.js"></script>
<script src="../js/products.js"></script>

</body>
</html>
