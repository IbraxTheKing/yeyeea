<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Boutique - Yeya Informatique</title>

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

<header class="shop-header">
    <h2>Yeya Informatique</h2>

    <nav>
        <a href="../index.html">Accueil</a>
        <a href="cart.html">Panier</a>
        <a href="../login.html">Login</a>
    </nav>
</header>

<main class="container">

    <div class="shop-layout">

        <!-- SIDEBAR -->
        <aside class="sidebar">

            <h3>Catégories</h3>

            <ul id="categoryList">
                <li onclick="filterCategory('all')">Toutes</li>
            </ul>

            <hr>

            <h3>Prix</h3>

            <div class="price-slider">
                <input type="range" id="priceRange" min="0" max="2000" value="2000">
                <div class="price-values">
                    <span>0€</span>
                    <span id="priceMax">2000€</span>
                </div>

                <button onclick="applyPriceRange()">Appliquer</button>
            </div>

            <hr>

        </aside>

        <!-- CONTENT -->
        <div class="shop-content">

            <section class="shop-hero">
                <h1>Notre boutique</h1>
                <p>Matériel informatique sélectionné, testé et adapté à vos besoins.</p>
            </section>

            <!-- FILTERS -->
            <div class="filter-bar">

                <select id="categoryFilter" onchange="onDropdownCategoryChange()">
                </select>


            </div>

            <!-- PRODUCTS -->
            <div id="products"></div>

        </div>
    </div>

</main>

<!-- JS -->
<script src="../js/api.js"></script>
<script src="../js/cart.js"></script>
<script src="../js/products.js"></script>

</body>
</html>
